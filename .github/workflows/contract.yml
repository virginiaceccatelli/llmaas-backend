# The mechanism behind "the two tiers cannot drift".
#
# Two jobs:
#   checks - fast, no Docker. Dependency pins and the broker's HTTP surface.
#   e2e    - the whole stack up, both repos' own test scripts run against it.
#
# The e2e job is the one that matters: it runs the FRONTEND's smoke suite
# against THIS commit's broker, using the frontend commit this repo pins. That
# is the only thing that actually proves the pair works together.

name: contract

on:
  push:
    branches: [main]
  pull_request:
  # Let the frontend repo trigger this after it merges, so a frontend change
  # is checked against the broker too:
  #   gh workflow run contract.yml --repo virginiaceccatelli/llmaas-backend
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive     # without this, frontend/ is an empty dir

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib only, so it runs before anything is installed and gives the
      # fastest possible signal on a version skew.
      - name: dependency pins agree across both tiers
        run: python contracts/check_drift.py

      - name: install broker deps
        run: python -m pip install -r broker/requirements-dev.txt

      - name: unit tests
        run: pytest -q

      - name: broker HTTP surface is unchanged
        run: python contracts/dump_openapi.py --check

  e2e:
    runs-on: ubuntu-latest
    # JOB scope, not step scope. docker-compose.full.yml interpolates
    # ${POSTGRES_PASSWORD:?} and friends on EVERY invocation, including
    # `logs` and `down` — so a step without these in its environment fails
    # with "required variable is not set" before Docker is even consulted.
    # That is exactly how the teardown steps broke on the first run.
    #
    # Not real secrets: the stack dies with the runner. What is under test is
    # that the two tiers agree on HOW the secret is used. hs256, never dev —
    # dev mode accepts an unverified header and proves nothing.
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      AUTH_JWT_SECRET: ci-shared-jwt-secret-not-a-real-one
      SESSION_SECRET: ci-session-secret-not-a-real-one
      MODELS_MOUNT: ./serving/models.ci.yaml
      # Low enough that verify.py's 70 requests trip it even if they straddle
      # a minute boundary on a slow runner. Still above the >=10 floor that
      # check asserts, so it also proves the limit is not absurdly low.
      RATE_LIMIT_PER_MIN: "20"
      AUTH_JWT_ISSUER: llmaas-frontend
      AUTH_JWT_AUDIENCE: llmaas-broker
      COMPOSE: docker compose -f docker-compose.full.yml --profile ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: bring up the full stack
        run: |
          cp .env.example .env
          $COMPOSE up -d --build --wait

      # smoke.py takes a single ambient token. verify.py needs to act as
      # several distinct users, so it mints its own from AUTH_JWT_SECRET
      # (inherited from the job env) — otherwise every call collapses to one
      # user and its key-listing, revocation and tenant checks compare a user
      # against itself.
      - name: broker deep checks
        run: |
          python -m pip install PyJWT
          # --issuer/--audience explicitly: make_token.py reads its defaults
          # from .env, where both are commented out, while the broker DOES
          # check them. A token minted without them 401s on verify_iss/aud.
          export LLMAAS_CONTROL_TOKEN=$(python scripts/make_token.py \
            --user ci-user --issuer "$AUTH_JWT_ISSUER" --audience "$AUTH_JWT_AUDIENCE")
          python scripts/smoke.py
          unset LLMAAS_CONTROL_TOKEN     # let verify.py mint per user
          python scripts/verify.py

      # The point of the whole workflow: the frontend's own suite, unmodified,
      # against this broker.
      - name: frontend smoke suite
        run: python frontend/scripts/smoke.py

      - name: logs on failure
        if: failure()
        run: $COMPOSE logs --no-color

      - name: tear down
        if: always()
        run: $COMPOSE down -v
