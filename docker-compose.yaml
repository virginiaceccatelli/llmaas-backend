services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmaas
      POSTGRES_PASSWORD: llmaas
      POSTGRES_DB: llmaas
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmaas"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Stands in for a real vLLM instance on a GPU VM.
  # Later: delete this service and point UPSTREAM_URL at the real vLLM.
  mock-vllm:
    build: ./mock-vllm
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://llmaas:llmaas@postgres:5432/llmaas
      REDIS_URL: redis://redis:6379/0
      UPSTREAM_URL: http://mock-vllm:8000
      KEY_PREFIX: wiit
      RATE_LIMIT_PER_MIN: "20"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-vllm:
        condition: service_started

volumes:
  pgdata: